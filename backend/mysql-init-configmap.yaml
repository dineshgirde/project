apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
  namespace: student-app

data:
  init.sql: |
    USE student_db;

    CREATE TABLE IF NOT EXISTS students (
      id BIGINT(20) NOT NULL AUTO_INCREMENT,
      name VARCHAR(255),
      email VARCHAR(255),
      course VARCHAR(255),
      student_class VARCHAR(255),
      percentage DOUBLE,
      branch VARCHAR(255),
      mobile_number VARCHAR(255),
      PRIMARY KEY (id)
    );
