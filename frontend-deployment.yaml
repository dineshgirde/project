apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: student-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: dineshgirde97/frontend-k8s 

        ports:
        - containerPort: 80
